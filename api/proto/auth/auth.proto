syntax = "proto3";

package auth;

option go_package = "github.com/rd2w/go-notes/pkg/proto/auth";

// AuthService предоставляет методы для аутентификации и авторизации
service AuthService {
  // Login - метод для аутентификации пользователя и получения токенов
  rpc Login(LoginRequest) returns (LoginResponse);
  
  // Logout - метод для выхода пользователя и отзыва токена
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  
  // Refresh - метод для обновления токена
  rpc Refresh(RefreshRequest) returns (RefreshResponse);
  
  // ValidateToken - метод для проверки валидности токена
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
}

// LoginRequest - запрос на аутентификацию
message LoginRequest {
  string username = 1;
  string password = 2;
}

// LoginResponse - ответ на аутентификацию
message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 access_token_expires_at = 3; // Время истечения access токена в Unix timestamp
  int64 refresh_token_expires_at = 4; // Время истечения refresh токена в Unix timestamp
  string token_type = 5; // Тип токена (обычно "Bearer")
}

// LogoutRequest - запрос на выход
message LogoutRequest {
  string access_token = 1;
  string refresh_token = 2;
}

// LogoutResponse - ответ на выход
message LogoutResponse {
  bool success = 1;
  string message = 2;
}

// RefreshRequest - запрос на обновление токена
message RefreshRequest {
  string refresh_token = 1;
}

// RefreshResponse - ответ на обновление токена
message RefreshResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 access_token_expires_at = 3; // Время истечения нового access токена в Unix timestamp
  int64 refresh_token_expires_at = 4; // Время истечения нового refresh токена в Unix timestamp (может быть обновлено)
  string token_type = 5; // Тип токена (обычно "Bearer")
}

// ValidateTokenRequest - запрос на проверку токена
message ValidateTokenRequest {
 string token = 1;
}

// ValidateTokenResponse - ответ на проверку токена
message ValidateTokenResponse {
  bool valid = 1;
  string username = 2;
  int64 expires_at = 3; // Время истечения токена в Unix timestamp
  string error_message = 4; // Сообщение об ошибке, если токен недействителен
}