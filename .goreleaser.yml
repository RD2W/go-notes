version: 2

# Определяем проект и его метаданные
project_name: go-notes

# Определяем, что мы хотим выпускать
builds:
  # Сборка grpc-server
  - id: grpc-server
    main: ./cmd/grpc-server
    binary: grpc-server
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    gcflags:
      - all=-trimpath
    ldflags:
      - -s -w
      - -extldflags '-static'
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    flags:
      - -a
    tags:
      - osusergo
      - netgo
      - static

  # Сборка web-server
  - id: web-server
    main: ./cmd/web-server
    binary: web-server
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    gcflags:
      - all=-trimpath
    ldflags:
      - -s -w
      - -extldflags '-static'
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    flags:
      - -a
    tags:
      - osusergo
      - netgo
      - static

# Упаковка артефактов
# Один архив для каждой комбинации OS/Arch, содержащий оба бинарника (grpc-server и web-server)
archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    ids:
      - grpc-server
      - web-server
    files:
      - LICENSE
      - README.md
      - src: config/config.toml
        dst: config/config.toml
    format_overrides:
      - goos: windows
        formats: ["zip"]
    formats: ["tar.gz"]

